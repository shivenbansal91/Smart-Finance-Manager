<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with app gradient -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Wallet body -->
  <rect x="10" y="20" width="44" height="30" rx="5" fill="white" fill-opacity="0.92"/>

  <!-- Wallet flap / top strip -->
  <rect x="10" y="20" width="44" height="10" rx="5" fill="white"/>
  <rect x="10" y="25" width="44" height="5" fill="white"/>

  <!-- Card slot line -->
  <line x1="18" y1="35" x2="46" y2="35" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="41" x2="36" y2="41" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Coin circle -->
  <circle cx="47" cy="42" r="7" fill="url(#bg)" stroke="white" stroke-width="1.5"/>
  <text x="47" y="46" text-anchor="middle" font-size="8" font-family="Arial" font-weight="bold" fill="white">₹</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12e890"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12e890"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
</svg>
